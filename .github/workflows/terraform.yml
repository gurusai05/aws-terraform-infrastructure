name: Terraform validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - name: Check formatting
        run: terraform -chdir=terraform fmt -check -recursive
      - name: Initialize providers without backend
        run: terraform -chdir=terraform init -backend=false -input=false
      - name: Validate configuration
        run: terraform -chdir=terraform validate
      - name: Shell script syntax
        run: bash -n terraform/user-data.sh
      - name: Run repository checks
        run: python3 -m unittest discover -s tests -v
